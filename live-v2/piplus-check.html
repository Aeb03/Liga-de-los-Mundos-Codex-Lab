<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE v2 — Piplus</title><link rel="stylesheet" href="client/ui.css"><link rel="stylesheet" href="client/presentation.css?v=20261004-piplus1"><body class="in-arena"><header><h1>LIVE v2 · Piplus</h1><span>Revisión sin sala ni conexión</span><button id="shot">Disparo Preciso</button><button id="dash">Impulso</button></header><main id="app"></main><script type="module">
import {renderArena} from './client/presentation.mjs?v=20261004-piplus1';
import {createUnit,initializeCombat,markPiplus,useAbility} from './combat-core.mjs?v=20261004-piplus1';
const slots={A1:{id:'A1',team:'A',controllerId:'demo',championId:'piplus',position:{x:4,y:5},skills:['precise','vector','impulse','fixation'],confirmed:true},B1:{id:'B1',team:'B',controllerId:'rival',championId:'coloso',position:{x:7,y:5},skills:['rock','stonearmor','quake','collapse'],confirmed:true}};
let combat=initializeCombat({units:Object.values(slots).map(s=>createUnit({...s,slot:1})),obstacles:[{x:5,y:4},{x:6,y:4},{x:5,y:7},{x:6,y:7}]}).state;
combat=markPiplus(combat,{unitId:'A1',targetId:'B1'}).state;
combat=useAbility(combat,{unitId:'A1',abilityId:'fixation',targetId:'B1'}).state;
const state={id:'fixture',phase:'combat',slots,combat};let abilitySelection={abilityId:'precise',targetId:'B1'};
function render(){document.querySelector('#app').innerHTML=renderArena({state,actor:'demo',slotId:'A1',preview:null,blocked:false,canMove:true,remaining:24,abilitySelection});}
document.querySelector('#shot').onclick=()=>{abilitySelection={abilityId:'precise',targetId:'B1'};render();};document.querySelector('#dash').onclick=()=>{abilitySelection={abilityId:'impulse',position:{x:6,y:5}};render();};render();
</script></body></html>
