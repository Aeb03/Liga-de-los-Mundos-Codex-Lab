name: Build Liga de los Mundos APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto privado
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Preparar proyecto APK
        run: |
          mkdir -p apk-build/www
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            ./ apk-build/www/

          cd apk-build

          cat > package.json <<'JSON'
          {
            "name": "liga-de-los-mundos-apk",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "latest",
              "@capacitor/android": "latest"
            },
            "devDependencies": {
              "@capacitor/cli": "latest"
            }
          }
          JSON

          npm install

          npx cap init "Liga de los Mundos" "com.ligadelosmundos.game" --web-dir=www
          npx cap add android

          # Icono oficial de Liga de los Mundos para Android.
          # Conserva el arte original; Android se encarga del recorte/escala por densidad.
          for d in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$d"
            cp www/icon-512.png "$d/ic_launcher.png"
            cp www/icon-512.png "$d/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values android/app/src/main/res/mipmap-anydpi-v26
          cp www/icon-maskable-512.png android/app/src/main/res/drawable/liga_icon_foreground.png
          cat > android/app/src/main/res/values/liga_icon_colors.xml <<'XML'
          <resources><color name="liga_icon_background">#07111A</color></resources>
          XML
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/liga_icon_background"/>
            <foreground android:drawable="@drawable/liga_icon_foreground"/>
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Compilar APK
        working-directory: apk-build/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Liga-de-los-Mundos-APK
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
