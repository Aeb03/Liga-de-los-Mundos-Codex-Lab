name: live-v2-postgres
on: [pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: psql -h localhost -U postgres -c "create role anon; create role authenticated; create role service_role;"
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610030001_live_v2_authority.sql
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f live-v2/server/sql/postgres-contract.test.sql
      - run: node --test live-v2/*.test.mjs live-v2/server/*.test.mjs
